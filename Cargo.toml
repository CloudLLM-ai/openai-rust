[package]
name = "openai-rust2"
version = "2.0.0"
edition = "2021"
authors = ["gubatron", "LevitatingBusinessMan"]
description = "An unofficial library for the OpenAI API (OpenAI-compatible endpoints, streaming chat, Responses API, images)"
repository = "https://github.com/cloudllm-ai/openai-rust"
keywords = ["openai", "gpt", "library", "api", "async"]
documentation = "https://docs.rs/openai-rust2"
categories = ["api-bindings"]
readme = "README.md"
license = "MIT"

[[example]]
name = "chat"
path = "examples/chat_example.rs"
doc-scrape-examples = true

[[example]]
name = "chat_stream"
path = "examples/chat_stream_example.rs"

[dependencies]
anyhow = "1.0.103"
bytes = "1.12"
futures-util = "0.3.32"
lazy_static = "1.5"
# reqwest types (`Client`, `Url`, `Response`) are part of this crate's public
# API, so the reqwest major is part of ours: 2.x = reqwest 0.13.
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
base64 = "0.22.1"
# Needed for the application-level retry sleep inside `create_chat`; the
# connection-pooling retry is already handled by the shared reqwest client.
tokio = { version = "1.52", features = ["time"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4"
